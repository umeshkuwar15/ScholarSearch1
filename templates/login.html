<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ScholarSearch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        :root { --primary-glow: #0d6efd; --card-bg: #1a1d23; --border-color: #2d323e; }
        body { background: #0f1117; min-height: 100vh; display: flex; align-items: center; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; background: linear-gradient(135deg,#0d6efd,#6610f2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); max-width: 420px; margin: 0 auto; }
        .form-floating>.form-control { background: #0f1117; border: 1px solid var(--border-color); color: #e0e0e0; }
        .form-floating>.form-control:focus { border-color: var(--primary-glow); box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15); }
        .form-floating label { color: #6c757d; }
        .btn-auth { padding: 0.75rem 2rem; font-weight: 600; border-radius: 10px; background: linear-gradient(135deg,#0d6efd,#6610f2); border: none; transition: all 0.3s ease; }
        .btn-auth:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(13,110,253,0.4); }
        .alert-error { background: rgba(220,53,69,0.1); border: 1px solid rgba(220,53,69,0.3); color: #e0a0a0; border-radius: 10px; }
        .footer { text-align: center; padding: 1.5rem 0; color: #6c757d; font-size: 0.85rem; }
        .brand-icon { font-size: 2.5rem; background: linear-gradient(135deg,#0d6efd,#6610f2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <div class="brand-icon"><i class="bi bi-search-heart"></i></div>
            <a class="navbar-brand text-decoration-none" href="/">ScholarSearch</a>
            <p class="text-secondary">Sign in to search academic literature</p>
        </div>

        <div class="auth-card">
            <h4 class="text-light mb-3"><i class="bi bi-box-arrow-in-right"></i> Login</h4>

            {% if error %}
            <div class="alert alert-error d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="post">
                <div class="mb-3">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" value="{{ username or '' }}" required autofocus>
                        <label for="username"><i class="bi bi-person"></i> Username</label>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password"><i class="bi bi-lock"></i> Password</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth text-white w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>

            <div class="text-center mt-3 text-secondary">
                Don't have an account?
                <a href="/register" class="text-primary text-decoration-none">Register here</a>
            </div>
        </div>

        <div class="footer">
            <p class="mb-0"><i class="bi bi-search-heart"></i> ScholarSearch v1.0.0 &mdash; Powered by arXiv, CrossRef, OpenAlex, PubMed &amp; Semantic Scholar</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
